<script>
/* =========================================================
   إعدادات عامة
========================================================= */
const AR_DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const SHIFT_NAMES = ["الوردية الأولى","الوردية الثانية","الوردية الثالثة","الوردية الرابعة","الوردية الخامسة"];

/* =========================================================
   أدوات التاريخ
========================================================= */
function pad(n){ return n.toString().padStart(2,"0"); }
function isoOf(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(d, n){ const c = new Date(d); c.setDate(c.getDate()+n); return c; }
function startOfToday(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function formatDate(d){ return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; }
function dayName(d){ return AR_DAYS[d.getDay()]; }
function shiftLabel(n){ return (n>=1 && n<=SHIFT_NAMES.length) ? SHIFT_NAMES[n-1] : `الوردية رقم ${n}`; }

let state = { view:"home", currentIso:null, createdIso:null };

/* =========================================================
   طبقة التخزين المشتركة (Firebase Firestore)
   كل المستخدمين (الزملاء/المدير) بيشوفوا ويعدّلوا نفس البيانات،
   لأن التخزين بقى على قاعدة بيانات سحابية مشتركة بدل localStorage.
   بنستخدم مجموعة (collection) واحدة اسمها "kv"، وكل مفتاح (key)
   بيتحول لاسم مستند (document id) فيها، بنفس شكل المفاتيح القديمة.
========================================================= */
const KV_COLLECTION = "kv";

// Firestore document IDs مينفعش فيها "/" فبنستبدلها برمز آمن
function safeDocId(key){
  return key.replace(/\//g, "__slash__");
}

async function storageGet(key){
  try{
    const doc = await db.collection(KV_COLLECTION).doc(safeDocId(key)).get();
    if(!doc.exists) return null;
    const data = doc.data();
    return (data && typeof data.value === "string") ? data.value : null;
  }catch(e){ console.warn("storage get failed", e); return null; }
}
async function storageSet(key, value){
  try{
    await db.collection(KV_COLLECTION).doc(safeDocId(key)).set({
      value: value,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return true;
  }catch(e){ console.error("storage set failed", e); return false; }
}

/* =========================================================
   تنبيه الحفظ
========================================================= */
function flashSaved(text="تم الحفظ", warn=false){
  const f = document.getElementById("saveFlag");
  f.textContent = text;
  f.classList.toggle("warn", warn);
  f.classList.add("show");
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>f.classList.remove("show"), 1600);
}

/* =========================================================
   إعداد اليوم الأول + قائمة الأيام
========================================================= */
async function ensureCreatedDate(){
  let iso = await storageGet("meta:created_date");
  if(!iso){
    iso = isoOf(startOfToday());
    await storageSet("meta:created_date", iso);
  }
  state.createdIso = iso;
}

function buildDayList(){
  const created = new Date(state.createdIso + "T00:00:00");
  const today = startOfToday();
  const tomorrow = addDays(today, 1);
  const days = [];
  let cursor = new Date(created);
  while(cursor.getTime() <= tomorrow.getTime()){
    days.push(new Date(cursor));
    cursor = addDays(cursor, 1);
  }
  return days.reverse(); // الأحدث (غدًا) أولًا
}

async function countEventsForDay(iso){
  const meta = await loadMeta(iso);
  let count = 0;
  for(let s=1; s<=(meta.shiftsCount||1); s++){
    const rows = await loadRows(iso, s);
    count += rows.filter(r => (r.camera||"").trim() || (r.event||"").trim() || (r.time||"").trim()).length;
  }
  return count;
}

/* =========================================================
   الصفحة الرئيسية
========================================================= */
async function renderHome(){
  const app = document.getElementById("app");
  app.innerHTML = `<div class="loading-msg">جارِ التحميل…</div>`;
  const days = buildDayList();
  const today = startOfToday();
  const tomorrow = addDays(today,1);

  const rowsHtml = await Promise.all(days.map(async d=>{
    const iso = isoOf(d);
    const count = await countEventsForDay(iso);
    let badge = "";
    if(d.getTime() === today.getTime()) badge = `<span class="day-badge badge-today">اليوم</span>`;
    else if(d.getTime() === tomorrow.getTime()) badge = `<span class="day-badge badge-tomorrow">غدا</span>`;
    return `
      <div class="day-row" data-iso="${iso}">
        <div class="day-main">
          <span class="day-name">${dayName(d)}</span>
          ${badge}
        </div>
        <div class="day-right">
          <span class="day-date mono">${formatDate(d)}</span>
          <span class="day-count">${count ? count + " حدث مسجّل" : "لا يوجد سجل بعد"}</span>
        </div>
      </div>`;
  }));

  app.innerHTML = `
    <header class="app-head">
      <h1>سجل تقارير الكاميرات</h1>
      <p>اختر اليوم لفتح تقريره</p>
    </header>
    <div class="day-list">${rowsHtml.join("")}</div>
  `;

  app.querySelectorAll(".day-row").forEach(el=>{
    el.addEventListener("click", ()=> openReport(el.dataset.iso));
  });
}

async function openReport(iso){
  state.view = "report";
  state.currentIso = iso;
  await renderReport();
}

/* =========================================================
   صفوف الأحداث (الكاميرا / الوقت / الحدث) لكل وردية
========================================================= */
function emptyRow(){ return { camera:"", time:"", ampm:"AM", event:"" }; }

function normalizeRow(r){
  return { camera:r.camera||"", time:r.time||"", ampm:(r.ampm==="PM"?"PM":"AM"), event:r.event||"" };
}

async function loadRows(iso, shiftIndex){
  const raw = await storageGet(`rows:${iso}:${shiftIndex}`);
  if(!raw){
    return [emptyRow()];
  }
  try{
    const parsed = JSON.parse(raw);
    return parsed.length ? parsed.map(normalizeRow) : [emptyRow()];
  }catch(e){ return [emptyRow()]; }
}

async function saveRows(iso, shiftIndex, rows){
  const ok = await storageSet(`rows:${iso}:${shiftIndex}`, JSON.stringify(rows));
  flashSaved(ok ? "تم الحفظ ☁" : "تعذّر الحفظ، تحقق من الاتصال", !ok);
}

/* =========================================================
   بيانات كل بلوك (وردية): الجدول + الحالة + محررو التقرير + التوقيعات
   كل بلوك مستقل بالكامل عن غيره، ولا يحمل أي اسم/رقم وردية ظاهر.
========================================================= */
function defaultShiftMeta(shiftIndex){
  const s = shiftIndex || 1;
  return {
    allGood:false,
    fault:"",
    editors:[{ name:"", shift:s }],
    signatures:[""]
  };
}

function normalizeShiftMeta(sm, fallbackShift){
  const fb = fallbackShift || 1;
  const base = defaultShiftMeta(fb);
  if(!sm || typeof sm !== "object") return base;
  const out = Object.assign({}, base, sm);
  if(!Array.isArray(out.editors) || out.editors.length === 0){
    out.editors = [{ name:"", shift:fb }];
  }
  // دعم الصيغ القديمة لمحرري التقرير (نص بسيط بدون وردية)
  out.editors = out.editors.map(e => {
    if(typeof e === "string") return { name:e, shift:fb };
    return { name:(e && e.name) || "", shift:(e && e.shift) || fb };
  });
  if(!Array.isArray(out.signatures) || out.signatures.length === 0){
    out.signatures = [""];
  }
  return out;
}

function defaultMeta(){
  return {
    shiftsCount:1,
    shifts:{ 1: defaultShiftMeta(1) }
  };
}

async function loadMeta(iso){
  const raw = await storageGet("meta:report:"+iso);
  const meta = defaultMeta();
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === "object"){
        meta.shiftsCount = (parsed.shiftsCount && parsed.shiftsCount >= 1) ? parsed.shiftsCount : 1;

        if(parsed.shifts && typeof parsed.shifts === "object"){
          meta.shifts = {};
          for(let s=1; s<=meta.shiftsCount; s++){
            meta.shifts[s] = normalizeShiftMeta(parsed.shifts[s], s);
          }
        }else{
          // ترحيل الصيغة القديمة (حالة/محررون/توقيعات موحّدة لكل التقرير بأكمله)
          const migrated = normalizeShiftMeta({
            allGood: parsed.allGood,
            fault: parsed.fault,
            editors: parsed.editors,
            signatures: parsed.signatures
          }, 1
